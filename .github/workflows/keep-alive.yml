name: Keep Render Awake

on:
  schedule:
    # Chạy mỗi 10 phút một lần (Render sleep sau 15 phút không hoạt động)
    - cron: "*/10 * * * *"
  workflow_dispatch: # Cho phép bấm chạy thủ công nếu cần

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend Render
        # THAY THẾ DOMAIN NÀY BẰNG ĐƯỜNG DẪN RENDER THỰC TẾ CỦA BẠN (VD: https://exam-app-api.onrender.com)
        # NẾU BẠN KHÔNG CẦN CHỨC NĂNG NÀY NỮA, HÃY XÓA FILE NÀY!
        run: |
          curl -sSf https://scofield-backend.onrender.com > /dev/null
          echo "Ping successful!"

